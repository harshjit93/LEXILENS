<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LexiLens</title>
  <!-- load google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page-body">

  <div class="auth-page-wrapper">
    <div class="auth-card-clean">
      <!-- brand header inside card -->
      <div class="auth-brand-header">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon-svg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
              <circle cx="12" cy="8" r="2.5"></circle>
            </svg>
          </div>
          <span class="brand-name">LexiLens</span>
        </a>
        <p class="auth-sub-desc">Sign in to your learning account</p>
      </div>

      <!-- login signup tabs -->
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab-btn active" type="button">Log In</button>
        <button id="tab-signup" class="auth-tab-btn" type="button">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input class="form-input" type="email" id="login-email" placeholder="e.g. teacher@demo.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="toggle-password" data-target="login-password" aria-label="Toggle password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          <span>Log In to LexiLens</span>
          <span>→</span>
        </button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="form-signup" style="display: none;">
        <div class="form-group">
          <label class="form-label">I am a:</label>
          <div class="role-selection">
            <div class="role-card selected" id="role-student" data-role="student" role="button" tabindex="0" aria-label="Select Student role">
              <div class="role-icon-svg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
              </div>
              <div class="role-title">Student</div>
              <div class="role-sub">Take screening & read</div>
            </div>
            <div class="role-card" id="role-teacher" data-role="teacher" role="button" tabindex="0" aria-label="Select Teacher role">
              <div class="role-icon-svg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
              </div>
              <div class="role-title">Teacher</div>
              <div class="role-sub">Track class progress</div>
            </div>
          </div>
          <input type="hidden" id="signup-role" value="student">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <input class="form-input" type="text" id="signup-name" placeholder="e.g. Maya Sharma" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <input class="form-input" type="email" id="signup-email" placeholder="e.g. maya@school.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Create Password</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="signup-password" placeholder="At least 4 characters" required>
            <button type="button" class="toggle-password" data-target="signup-password" aria-label="Toggle password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- student specific fields -->
        <div id="student-extra-fields">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group">
              <label class="form-label" for="signup-class">Class / Grade</label>
              <input class="form-input" type="text" id="signup-class" placeholder="e.g. Grade 6">
            </div>
            <div class="form-group">
              <label class="form-label" for="signup-roll">Roll Number</label>
              <input class="form-input" type="text" id="signup-roll" placeholder="e.g. 106">
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          <span>Create Account</span>
          <span>✓</span>
        </button>
      </form>

      <!-- instant demo buttons -->
      <div class="quick-demos">
        <p style="font-size: 0.85rem; color: var(--text-soft); margin-bottom: 8px; text-align: center;">Try instant demo accounts:</p>
        <div class="demo-buttons" style="justify-content: center;">
          <button type="button" class="btn btn-sm btn-secondary" id="btn-demo-teacher">
            <span>Teacher Demo</span>
          </button>
          <button type="button" class="btn btn-sm btn-secondary" id="btn-demo-student">
            <span>Student Demo</span>
          </button>
        </div>
        <p style="font-size: 0.76rem; color: var(--text-soft); margin-top: 10px; text-align: center;">
          Teacher: <code>teacher@demo.com</code> • Student: <code>student@demo.com</code> (Pass: <code>1234</code> / <code>demo123</code>)
        </p>
      </div>
    </div>
  </div>

  <!-- script dependencies -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // initialize login auth
    window.addEventListener("DOMContentLoaded", () => {
      // setup password toggles
      if (typeof setupPasswordToggles === "function") {
        setupPasswordToggles();
      }

      // tabs login signup
      const tabLogin = document.getElementById("tab-login");
      const tabSignup = document.getElementById("tab-signup");
      const formLogin = document.getElementById("form-login");
      const formSignup = document.getElementById("form-signup");

      function switchToLogin() {
        if (tabLogin && tabSignup && formLogin && formSignup) {
          tabLogin.classList.add("active");
          tabSignup.classList.remove("active");
          formLogin.style.display = "block";
          formSignup.style.display = "none";
        }
      }

      function switchToSignup() {
        if (tabLogin && tabSignup && formLogin && formSignup) {
          tabSignup.classList.add("active");
          tabLogin.classList.remove("active");
          formSignup.style.display = "block";
          formLogin.style.display = "none";
        }
      }

      if (tabLogin && tabSignup) {
        tabLogin.addEventListener("click", switchToLogin);
        tabSignup.addEventListener("click", switchToSignup);
      }

      // role cards selection
      const roleStudent = document.getElementById("role-student");
      const roleTeacher = document.getElementById("role-teacher");
      const signupRole = document.getElementById("signup-role");
      const studentFields = document.getElementById("student-extra-fields");

      function selectStudentRole() {
        if (roleStudent && roleTeacher) {
          roleStudent.classList.add("selected");
          roleTeacher.classList.remove("selected");
          if (signupRole) signupRole.value = "student";
          if (studentFields) studentFields.style.display = "block";
        }
      }

      function selectTeacherRole() {
        if (roleStudent && roleTeacher) {
          roleTeacher.classList.add("selected");
          roleStudent.classList.remove("selected");
          if (signupRole) signupRole.value = "teacher";
          if (studentFields) studentFields.style.display = "none";
        }
      }

      if (roleStudent && roleTeacher) {
        roleStudent.addEventListener("click", selectStudentRole);
        roleStudent.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectStudentRole();
          }
        });

        roleTeacher.addEventListener("click", selectTeacherRole);
        roleTeacher.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectTeacherRole();
          }
        });
      }

      // login submit
      if (formLogin) {
        formLogin.addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("login-email") ? document.getElementById("login-email").value : "";
          const password = document.getElementById("login-password") ? document.getElementById("login-password").value : "";
          handleLogin(email, password);
        });
      }

      // signup submit
      if (formSignup) {
        formSignup.addEventListener("submit", (e) => {
          e.preventDefault();
          const name = document.getElementById("signup-name") ? document.getElementById("signup-name").value : "";
          const email = document.getElementById("signup-email") ? document.getElementById("signup-email").value : "";
          const password = document.getElementById("signup-password") ? document.getElementById("signup-password").value : "";
          const role = document.getElementById("signup-role") ? document.getElementById("signup-role").value : "student";
          const studentClass = document.getElementById("signup-class") ? document.getElementById("signup-class").value : "";
          const rollNo = document.getElementById("signup-roll") ? document.getElementById("signup-roll").value : "";
          handleSignup(name, email, password, role, studentClass, rollNo);
        });
      }

      // instant demo buttons
      const btnDemoTeacher = document.getElementById("btn-demo-teacher");
      const btnDemoStudent = document.getElementById("btn-demo-student");

      if (btnDemoTeacher) {
        btnDemoTeacher.addEventListener("click", (e) => {
          e.preventDefault();
          switchToLogin();
          const emailInput = document.getElementById("login-email");
          const passInput = document.getElementById("login-password");
          if (emailInput) emailInput.value = "teacher@demo.com";
          if (passInput) passInput.value = "teacher123";
          handleLogin("teacher@demo.com", "teacher123");
        });
      }

      if (btnDemoStudent) {
        btnDemoStudent.addEventListener("click", (e) => {
          e.preventDefault();
          switchToLogin();
          const emailInput = document.getElementById("login-email");
          const passInput = document.getElementById("login-password");
          if (emailInput) emailInput.value = "student@demo.com";
          if (passInput) passInput.value = "student123";
          handleLogin("student@demo.com", "student123");
        });
      }
    });
  </script>
</body>
</html>
